name: Deploy

# Deploys the server to Fly.io (fly.toml). Runs when a GitHub release is
# published, or by hand from the Actions tab. The `production` environment
# holds the deploy token (secret FLY_API_TOKEN) and the deployment's own
# values (variables FLY_APP and SERVER_URL), which replace the placeholders in
# fly.toml. When the app uses Postgres, the environment also holds its
# connection string (secret DATABASE_URL), which the wipe below reaches the
# database with. Pull requests from forks cannot reach that environment. See
# docs/deployment-fly.io.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          The tag, branch or commit to deploy, when it is not the one the
          workflow runs from. Rolling back deploys a previous tag this way, with
          the current workflow.
        type: string
        default: ''
      wipe_data:
        description: >-
          Wipe the production data volume and the production Postgres database
          before deploying. Every Space is deleted. The server then starts over
          an empty data directory and an empty schema.
        type: boolean
        default: false

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      FLY_APP: ${{ vars.FLY_APP }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - name: Check deployment variables
        run: |
          if [ -z "$FLY_APP" ] || [ -z "$SERVER_URL" ]; then
            echo "::error::Set the FLY_APP and SERVER_URL variables on the production environment."
            exit 1
          fi

      # An empty ref checks out the commit the workflow runs from.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # A restore point from before the roll. Fly replaces the one machine in
      # place, so a deploy whose health check fails leaves it on the new image
      # with no automatic rollback (docs/deployment-fly.io.md, "Rolling
      # back"). Skipped when the app mounts no volume (the Postgres backend).
      # Fly refuses a second snapshot while one is still scheduled, as after a
      # deploy that just failed. The job goes on with a warning then, since
      # the scheduled one may not be taken before this deploy writes.
      - name: Snapshot data volume
        run: |
          volume="$(flyctl volumes list --app "$FLY_APP" --json | jq -r '.[0].id // empty')"
          if [ -z "$volume" ]; then
            echo "No volume to snapshot."
            exit 0
          fi
          if output="$(flyctl volumes snapshots create "$volume" --app "$FLY_APP" 2>&1)"; then
            echo "$output"
            exit 0
          fi
          echo "$output"
          if echo "$output" | grep -q 'snapshot is already scheduled'; then
            echo "::warning::A snapshot of $volume is already scheduled and may not be taken before this deploy writes."
            exit 0
          fi
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Connects to the database before either wipe, so a database the runner
      # cannot reach stops the job before anything is wiped.
      - name: Check Postgres database
        if: github.event_name == 'workflow_dispatch' && inputs.wipe_data
        run: |
          if [ -z "$DATABASE_URL" ]; then
            exit 0
          fi
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --command 'SELECT 1' > /dev/null
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Clears the volume on the running machine, keeping the ext4 lost+found
      # directory. Runs after the snapshot above, so the wiped data has a
      # restore point. The exec call needs a running machine: when the current
      # release does not boot, deploy the previous tag first.
      - name: Wipe data volume
        if: github.event_name == 'workflow_dispatch' && inputs.wipe_data
        run: |
          machine="$(flyctl machine list --app "$FLY_APP" --json | jq -r '.[0].id')"
          if [ -z "$machine" ] || [ "$machine" = null ]; then
            echo "::error::No machine found for $FLY_APP."
            exit 1
          fi
          flyctl machine exec --app "$FLY_APP" "$machine" \
            "find /data -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf {} +"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Drops the `public` schema and creates it again empty. With no
      # DATABASE_URL secret there is no Postgres backend to wipe.
      - name: Wipe Postgres database
        if: github.event_name == 'workflow_dispatch' && inputs.wipe_data
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret on the production environment, so there is no Postgres database to wipe."
            exit 0
          fi
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 \
            --command 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Builds the Dockerfile on Fly's remote builder and rolls the machine.
      - name: Deploy
        run: >-
          flyctl deploy --remote-only --app "$FLY_APP" --env
          "SERVER_URL=$SERVER_URL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
